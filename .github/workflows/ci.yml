name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:

  # ============================================================
  # 1. TRAIN MODEL
  # ============================================================
  train:
    name: Train Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt

      - name: Train model
        run: |
          python -m src.train

      - name: Verify model
        run: |
          test -f models/model.joblib
          test -f models/metrics.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            models/model.joblib
            models/metrics.json
          retention-days: 7


  # ============================================================
  # 3. TEST API WITH TRAINED MODEL
  # ============================================================
  api-test:
    name: API Integration Test
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@v5
        with:
          name: model-${{ github.sha }}
          path: models

      - name: Verify model artifact
        run: |
          test -f models/model.joblib
          test -f models/metrics.json

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py -v


  # ============================================================
  # 4. BUILD + PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: Build and Push Docker Image
    needs: api-test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download trained model
        uses: actions/download-artifact@v5
        with:
          name: model-${{ github.sha }}
          path: models

      - name: Verify model artifact
        run: |
          test -f models/model.joblib
          test -f models/metrics.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger DEVOPS deployment
        env:
          DEVOPS_TOKEN: ${{ secrets.DEVOPS_REPO_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEVOPS_TOKEN}" \
            https://api.github.com/repos/pkai21/kai-ops/dispatches \
            -d "{\"event_type\":\"image-updated\",\"client_payload\":{\"image\":\"ghcr.io/pkai21/california-housing-dev\",\"tag\":\"${IMAGE_TAG}\"}}"